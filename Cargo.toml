[package]
name = "forensic-carve"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Fleet carving contract + single-pass sweep engine: signature detection over unallocated/memory regions dispatched to per-format carvers. SecurityRonin forensic fleet."
repository = "https://github.com/SecurityRonin/forensic-carve"
authors = ["Albert Hui <albert@securityronin.com>"]
keywords = ["forensics", "carving", "dfir", "recovery"]
categories = ["parsing"]
readme = "README.md"

[lib]
name = "forensic_carve"

[dependencies]
aho-corasick = "1"
inventory = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
unwrap_used = { level = "deny", priority = 0 }
expect_used = { level = "deny", priority = 0 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
